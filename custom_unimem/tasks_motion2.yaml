# The prompt for the MOTION2 UniMem policy. See tasks_astribot.yaml — one entry, equal to
# MOTION2's `prompt` in robot_paths.py.
#
# The per-subtask strings below are NOT for a UniMem checkpoint: feeding them would put
# the current step in the `Task:` slot, which is the information event memory exists to
# supply. They are kept only for A/B-ing against a subtask-conditioned (non-UniMem)
# policy on the same robot.
tasks:
  - "get coffee, get ice, serve the drink"
