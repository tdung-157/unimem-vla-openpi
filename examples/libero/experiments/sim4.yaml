defaults:
  host: "127.0.0.1"
  port: 8000
  num_rollouts: 25
  max_episode_steps: 1200 # tune
  save_video: true
  video_out_path: "data/libero/videos"
  video_encoder: true
  num_frames: 3
  event_confidence_threshold: 0.8
  scoring:
    type: "object_return_xy"
    sigma: 0.05
  seed: -1
  infer_every_steps: 10
  num_steps_wait: 50
  track_object_pos_key: "box_a_pos"
  server:
    config: "libero_mem4"
    dir: "checkpoints/libero_mem4_finetune/mem4/49999"
  bddl_file: "../LIBERO/libero/libero/bddl_files/memory/task4_pick_up_back_down.bddl"

experiments:

  - name: "task4_ours"
    mode: "text_keyframe"

  - name: "task4_text"
    mode: "text"

  - name: "task4_keyframe"
    mode: "keyframe"

  - name: "task4_base"
    mode: "no_memory"

